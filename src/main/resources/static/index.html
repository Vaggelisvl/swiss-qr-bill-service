<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiss QR-bill demo</title>
  <style>
    :root { --bg:#f6f7fb; --surface:#fff; --text:#1c2033; --muted:#5e6580; --border:#dde1ee; --accent:#d52b1e; --ok:#1a7f4b; }
    @media (prefers-color-scheme: dark) { :root { --bg:#12141f; --surface:#1b1f30; --text:#e8eaf4; --muted:#9aa2c0; --border:#2a3050; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 20px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin: 10px 0 3px; }
    input, select { width: 100%; padding: 9px 10px; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    fieldset { border: 0; padding: 0; margin: 14px 0 0; }
    legend { font-weight: 600; padding: 0; }
    button { margin-top: 16px; width: 100%; padding: 11px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    #qr { display: block; width: 100%; max-width: 320px; margin: 0 auto 12px; background: #fff; padding: 12px; border-radius: 8px; image-rendering: pixelated; }
    pre { margin: 0; padding: 12px; overflow: auto; font-size: .78rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; max-height: 340px; }
    .error { color: #c0392b; background: rgba(192, 57, 43, .1); border: 1px solid rgba(192, 57, 43, .4); padding: 10px 12px; border-radius: 8px; }
    .placeholder { color: var(--muted); text-align: center; padding: 60px 0; }
  </style>
</head>
<body>
<main>
  <h1>Swiss QR-bill service</h1>
  <p class="lead">Fill in the invoice data, the service validates it (IBAN, reference check digits, amounts) and returns the QR code payload and image.</p>
  <div class="layout">
    <form id="form" class="card" autocomplete="off">
      <fieldset>
        <legend>Creditor</legend>
        <label for="iban">IBAN / QR-IBAN</label>
        <input id="iban" value="CH44 3199 9123 0008 8901 2">
        <label for="cname">Name</label>
        <input id="cname" value="Robert Schneider AG">
        <div class="row">
          <div><label for="cstreet">Street</label><input id="cstreet" value="Rue du Lac"></div>
          <div><label for="cno">No.</label><input id="cno" value="1268"></div>
        </div>
        <div class="row">
          <div><label for="czip">Postal code</label><input id="czip" value="2501"></div>
          <div><label for="ctown">Town</label><input id="ctown" value="Biel"></div>
        </div>
      </fieldset>
      <fieldset>
        <legend>Payment</legend>
        <div class="row">
          <div><label for="amount">Amount</label><input id="amount" inputmode="decimal" value="1949.75"></div>
          <div><label for="currency">Currency</label><select id="currency"><option>CHF</option><option>EUR</option></select></div>
        </div>
        <div class="row">
          <div><label for="rtype">Reference type</label><select id="rtype"><option>QRR</option><option>SCOR</option><option>NON</option></select></div>
          <div><label for="rvalue">Reference</label><input id="rvalue" value="210000000003139471430009017"></div>
        </div>
        <label for="info">Message</label>
        <input id="info" value="Invoice 10978" maxlength="140">
      </fieldset>
      <button type="submit">Generate QR-bill</button>
    </form>

    <section class="card" aria-live="polite">
      <div id="result"><div class="placeholder">The QR code appears here</div></div>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const result = $("result");

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const body = {
      creditorIban: $("iban").value,
      creditor: { name: $("cname").value, street: $("cstreet").value, buildingNumber: $("cno").value,
                  postalCode: $("czip").value, town: $("ctown").value, country: "CH" },
      amount: $("amount").value ? Number($("amount").value) : null,
      currency: $("currency").value,
      reference: { type: $("rtype").value, value: $("rvalue").value },
      additionalInformation: $("info").value
    };
    try {
      const response = await fetch("/api/v1/qr-bills", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
      });
      const data = await response.json();
      if (!response.ok) {
        const message = document.createElement("div");
        message.className = "error";
        message.textContent = (data.title || "Error") + ": " + (data.detail || "request failed");
        result.replaceChildren(message);
        return;
      }
      const img = document.createElement("img");
      img.id = "qr";
      img.alt = "Generated Swiss QR code";
      img.src = "data:image/png;base64," + data.qrCodePngBase64;
      const payload = document.createElement("pre");
      payload.textContent = data.payload;
      result.replaceChildren(img, payload);
    } catch (error) {
      const message = document.createElement("div");
      message.className = "error";
      message.textContent = "Network error";
      result.replaceChildren(message);
    }
  });
</script>
</body>
</html>
